[package]
name = "mcp-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
core-rust = { path = "../soul/core-rust" }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.80"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
nalgebra = "0.32"
futures = "0.3.32"

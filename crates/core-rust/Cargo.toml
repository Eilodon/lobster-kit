[package]
name = "core-rust"
version = "0.1.0"
authors = ["Eidolon Team"]
edition = "2021"
description = "High-performance WASM core for Eidolon Crypto/Trading Engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook", "sentinel", "memory", "math", "security"]
# Cognitive engine modules
sentinel = ["sentinel-causal", "sentinel-trauma", "sentinel-thermo"]
sentinel-causal = []
sentinel-trauma = []
sentinel-thermo = []
# Memory subsystems
memory = ["hyper-memory", "liquid-brain"]
hyper-memory = []
liquid-brain = []
# DeFi math primitives
math = []
# Security scoring engine
security = []
# Conversation domain config (opt-in)
conversation = []
wee_alloc = ["dep:wee_alloc"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2.99"
js-sys = "0.3"

# Fixed-point arithmetic for trading precision
fixed = "1.28"

# SIMD-portable operations
wide = "0.7"

# 256-bit integer support for Q64.96
ethnum = "1.5"

# Linear Algebra for Thermodynamic Logic
nalgebra = { version = "0.32", features = ["serde-serialize"] }

# Hashing and Time for Trauma Registry
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.20", features = ["v4", "js"] }

# Console error hook for debugging
console_error_panic_hook = { version = "0.1.7", optional = true }

# Web-sys for console logging (optional)
web-sys = { version = "0.3", features = ["console"] }

# Fast hashing for symbol lookups
fnv = "1.0"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Actor Model Channels
tokio = { version = "1.37", features = ["sync", "macros"] }

# Optional Allocator
wee_alloc = { version = "0.4", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for runtime throughput in WASM hot paths.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]
